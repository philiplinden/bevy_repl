[package]
name = "bevy_repl_derive"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
description = "Derive macros for bevy_repl"
license = "MIT OR Apache-2.0"
repository = "https://github.com/philiplinden/bevy_repl"
homepage = "https://philiplinden.github.io/bevy_repl/"
documentation = "https://docs.rs/bevy_repl_derive"
readme = "README.md"
keywords = ["bevy", "repl", "derive", "clap"]
categories = ["game-development", "development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
