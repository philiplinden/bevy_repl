name: Book

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow calls this with `deploy: true` after publishing, so
  # the live book always matches the latest release.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
  # For one-off fixes to the live book. Run it from the latest release tag.
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Install mdBook Table of Contents plugin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-toc
          version: '0.15.4'

      - name: Build book
        run: mdbook build

      - name: Upload artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./doc/book

  deploy:
    name: Deploy
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Don't cancel a deployment that's already running.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
