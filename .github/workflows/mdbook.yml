name: Deploy mdBook to GitHub Pages

on:
  pull_request:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          # Pinned to 0.4.x: mdbook-alerts depends on the `mdbook` crate directly
          # and hasn't been updated for the 0.5.x RenderContext format yet.
          mdbook-version: '0.4.52'

      - name: Install mdBook Table of Contents plugin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-toc
          # 0.15.x switched to the mdbook-preprocessor crate, which targets the
          # mdbook 0.5.x format; pin to the last 0.4.x-compatible release.
          version: '0.14.2'

      - name: Install mdBook alerts plugin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-alerts

      - name: Build book
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./doc/book

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
