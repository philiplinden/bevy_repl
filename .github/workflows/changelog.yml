name: Changelog

# Posts the unreleased changes as a PR comment. CHANGELOG.md itself is only
# regenerated by the release workflow.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview unreleased changes
    # PRs from forks get a read-only token and can't comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history and tags.
          fetch-depth: 0

      - name: Generate unreleased changes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: unreleased.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: mshick/add-pr-comment@v3
        with:
          message-path: unreleased.md
