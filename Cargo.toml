[workspace]
members = [".", "bevy_repl_derive"]

[package]
name = "bevy_repl"
version = "0.6.0"
edition = "2024"
description = "Add a REPL to the terminal for interactive headless or windowed Bevy applications"
license = "MIT"
repository = "https://github.com/philiplinden/bevy_repl"
keywords = ["bevy", "repl", "console", "debugging", "dev_tools", "tracing", "cli", "terminal", "headless", "utility"]
categories = ["game-development", "development-tools", "command-line-utilities"]

[dependencies]
bevy = { version = "0.19", default-features = false }
crossterm = "0.28"
clap = { version = "4.6" }
shell-words = "1.1"
ctrlc = "3"

# Optional features
bevy_repl_derive = { version = "0.1.0", path = "./bevy_repl_derive", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt", "ansi", "registry"] }

# FIXME(remove this after nothing depends on it)
bevy_ratatui = "0.11.1"

[features]
default = [
    "derive",
    "log",
    "default_commands",
]
derive = ["bevy_repl_derive", "clap/derive"]
log = ["dep:tracing-subscriber"]
default_commands = ["quit", "help", "clear"]
quit = []
help = []
clear = []

[[example]]
name = "aliases"
path = "examples/aliases.rs"

[[example]]
name = "alt_screen"
path = "examples/alt_screen.rs"

[[example]]
name = "builder"
path = "examples/builder.rs"

[[example]]
name = "builtins"
path = "examples/builtins.rs"

[[example]]
name = "custom_log_layer"
path = "examples/custom_log_layer.rs"

[[example]]
name = "custom_renderer"
path = "examples/custom_renderer.rs"

[[example]]
name = "default"
path = "examples/default.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "derive"
path = "examples/derive.rs"
required-features = ["derive"]

[[example]]
name = "fixed_update"
path = "examples/fixed_update.rs"

[[example]]
name = "keybinds"
path = "examples/keybinds.rs"

[[example]]
name = "log"
path = "examples/log.rs"

[[example]]
name = "minimal"
path = "examples/minimal.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[[example]]
name = "show_prompt_actions"
path = "examples/show_prompt_actions.rs"

[[example]]
name = "spawn_entity"
path = "examples/spawn_entity.rs"

[[example]]
name = "toggle"
path = "examples/toggle.rs"

[[example]]
name = "update_resource"
path = "examples/update_resource.rs"

[[example]]
name = "window"
path = "examples/window.rs"
required-features = ["bevy/bevy_window"]

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
